<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier Mansouri — Mena</title>
<meta name="description" content="Mena présente, chapitre par chapitre, l'affaire Abdelkrim Mansouri : récit, pièces téléchargeables, traductions françaises et imagerie satellite.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --bg-soft:#14171c; --panel:#181c22; --panel-2:#1e232b;
  --ink:#e9e6df; --ink-dim:#a39e93; --line:#2a2f37;
  --gold:#c8a35a; --gold-soft:#e0c489; --red:#c4554a; --ok:#6fae7d;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',serif;font-weight:600;line-height:1.2}
a{color:var(--gold-soft)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- barre du haut ---- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:12px 20px;background:rgba(13,15,18,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:'Playfair Display',serif;color:var(--gold-soft);letter-spacing:.04em;display:flex;align-items:center;gap:8px;text-decoration:none;font-size:1.02rem}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 13px;border-radius:999px;font-size:.84rem;text-decoration:none;white-space:nowrap;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#16130c;border-color:var(--gold);font-weight:500}
.btn.gold:hover{background:var(--gold-soft)}
.btn svg{width:15px;height:15px}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* ---- mise en page ---- */
.wrap{display:grid;grid-template-columns:360px 1fr;gap:28px;max-width:1280px;margin:0 auto;padding:24px 20px 80px}
aside{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);display:flex;flex-direction:column;gap:14px}

/* carte Mena */
.mena{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:center}
.avatar{position:relative;flex:0 0 84px;height:84px}
.avatar img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:block}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold);opacity:0;transform:scale(.92)}
.speaking .avatar::after{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}
.mena-txt b{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--gold-soft);font-weight:600;display:block}
.mena-txt span{font-size:.82rem;color:var(--ink-dim);display:block;line-height:1.45}
.player{display:flex;align-items:center;gap:6px;margin-top:10px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg-soft);color:var(--ink);display:grid;place-items:center}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn.main{width:46px;height:46px;background:var(--gold);color:#16130c;border-color:var(--gold)}
.icon-btn svg{width:18px;height:18px}
.speed{margin-inline-start:auto;font-size:.78rem;color:var(--ink-dim);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 9px}

/* sommaire */
.toc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;overflow:auto;min-height:120px}
.toc button{display:flex;gap:10px;width:100%;text-align:start;background:none;border:0;color:var(--ink-dim);padding:8px 10px;border-radius:9px;font-size:.88rem;line-height:1.35}
.toc button:hover{background:var(--bg-soft);color:var(--ink)}
.toc button.on{background:var(--bg-soft);color:var(--gold-soft)}
.toc-select{display:none;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem}
.toc .n{flex:0 0 22px;font-variant-numeric:tabular-nums;color:var(--gold);opacity:.8}

/* contenu */
main{min-width:0}
.hero{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}
.kicker{color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-size:.74rem;font-weight:500}
.hero h1{font-size:clamp(1.7rem,3.4vw,2.5rem);margin:6px 0 6px}
.hero p{color:var(--ink-dim);max-width:70ch}
.alert{margin-top:14px;border:1px solid #5a3a2a;background:#21170f;color:#e7c9a7;border-radius:10px;padding:10px 13px;font-size:.86rem}

.ch-head .kicker{display:block}
.ch-head h2{font-size:clamp(1.5rem,3vw,2.1rem);margin:4px 0 2px}
.ch-head .sous{color:var(--ink-dim);font-style:italic;font-family:'Playfair Display',serif;font-size:1.08rem}
.recit{margin:20px 0 6px;display:flex;flex-direction:column;gap:12px;max-width:74ch}
.recit p{padding:10px 14px;border-inline-start:3px solid transparent;border-start-end-radius:8px;border-end-end-radius:8px;transition:background .3s,border-color .3s;cursor:pointer;font-size:1.02rem}
.recit p:hover{background:rgba(255,255,255,.02)}
.recit p.on{background:rgba(200,163,90,.09);border-inline-start-color:var(--gold);color:#fff}

h3.sec{font-size:1.12rem;margin:30px 0 12px;color:var(--gold-soft);display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}

.faits{list-style:none;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.faits li{position:relative;padding:4px 0 10px;padding-inline-start:18px;font-size:.93rem}
.faits li::before{content:"";position:absolute;inset-inline-start:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.faits time{unicode-bidi:plaintext;color:var(--gold-soft);font-weight:500;font-variant-numeric:tabular-nums;margin-inline-end:8px}

/* pièces */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.piece{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.piece .thumb{height:150px;background:#0a0b0d center/cover no-repeat;border-bottom:1px solid var(--line);cursor:zoom-in;position:relative}
.piece .thumb .id{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);color:var(--gold-soft);font-weight:600;font-size:.78rem;padding:2px 8px;border-radius:6px}
.piece .body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.piece .t{font-size:.9rem;line-height:1.4;color:var(--ink)}
.piece .m{font-size:.76rem;color:var(--ink-dim);display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tag.ar{border-color:#46607a;color:#9fc0de}
.tag.warn{border-color:#6b4a2a;color:#e3b07a}
.piece .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.piece .acts .btn{font-size:.78rem;padding:5px 10px}

/* satellite */
.sat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.sat-view{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sat figure{position:relative}
.sat img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;display:block;background:#000}
.sat figcaption{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.75);padding:2px 9px;border-radius:6px;font-weight:600;font-size:.85rem;color:#fff}
.sat .state{font-size:.88rem;color:var(--ink-dim);margin-top:8px;min-height:2.6em}
.sat input[type=range]{direction:ltr;width:100%;accent-color:var(--gold);margin-top:10px}
.sat .ticks{direction:ltr;display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-dim)}
.sat .note{font-size:.8rem;color:#e3b07a;margin-top:8px}

/* bordereau */
table.bord{width:100%;border-collapse:collapse;font-size:.86rem}
.bord th,.bord td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:start;vertical-align:top}
.bord th{color:var(--ink-dim);font-weight:500;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em}
.bord td:first-child{color:var(--gold-soft);font-weight:600;white-space:nowrap}
.bord .dl{white-space:nowrap}
.bord .dl a{margin-inline-end:8px}
.tbl{overflow-x:auto}

/* navigation chapitre */
.chnav{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}

/* chat */
.chat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;flex:1 1 auto;max-height:46vh}
.chat-h{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.86rem;color:var(--gold-soft);display:flex;justify-content:space-between;align-items:center}
.chat-h label{color:var(--ink-dim);font-size:.75rem;display:flex;align-items:center;gap:5px}
.msgs{padding:10px 12px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:80px}
.msg{font-size:.86rem;line-height:1.5;padding:8px 11px;border-radius:12px;max-width:92%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--gold);color:#16130c}
.msg.ai{align-self:flex-start;background:var(--bg-soft);border:1px solid var(--line)}
.msg.wait{color:var(--ink-dim);font-style:italic}
.chat form{display:flex;gap:6px;padding:9px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:9px 13px;font:inherit;font-size:.88rem}
.chat input:focus{border-color:var(--gold);outline:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.sugg button{font-size:.74rem;border:1px solid var(--line);background:none;color:var(--ink-dim);border-radius:999px;padding:3px 9px}
.sugg button:hover{color:var(--ink);border-color:var(--gold)}

/* visionneuse */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;flex-direction:column}
.lb.on{display:flex}
.lb-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;color:var(--ink);font-size:.9rem}
.lb-b{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 24px}
.lb-b img{max-width:min(100%,1000px);border-radius:6px}
.lb-b iframe{width:min(100%,1000px);flex:1;min-height:80vh;border:0;background:#fff;border-radius:6px}

/* langues */
.lang{direction:ltr;display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 9px;font-size:.78rem;font-weight:500;color:var(--ink-dim)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#16130c}
html[data-l=ar] *{letter-spacing:0 !important}
html[data-l=ar] h1,html[data-l=ar] h2,html[data-l=ar] h3,html[data-l=ar] .brand,html[data-l=ar] .mena-txt b,
html[data-l=zh] h1,html[data-l=zh] h2,html[data-l=zh] h3{font-family:system-ui,sans-serif;font-weight:700}
html[data-l=ar] .ch-head .sous,html[data-l=zh] .ch-head .sous{font-style:normal;font-family:inherit}
html[data-l=ar] body,html[data-l=zh] body{font-family:system-ui,sans-serif;font-weight:400}

footer{max-width:1280px;margin:0 auto;padding:22px 20px 40px;color:var(--ink-dim);font-size:.8rem;border-top:1px solid var(--line)}

@media (max-width:960px){
  .wrap{display:flex;flex-direction:column;gap:14px;padding:16px 16px 70px}
  .wrap>*,aside>*{min-width:0;max-width:100%}
  aside{display:contents}
  .mena{order:1} .toc,.toc-select{order:2} main{order:3} .chat{order:4;margin-top:10px}
  .toc{display:none}
  .toc-select{display:block}
  .chat{max-height:60vh}
  .top{padding:10px 16px}
  .top-actions .btn span{display:none}
  .top-actions .btn:first-child span{display:inline}
}
@media (max-width:560px){ .brand{display:none} .top-actions{width:100%;justify-content:space-between} .lang button{padding:6px 7px} .sat-view{grid-template-columns:1fr} .pieces{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .speaking .avatar::after{animation:none} html{scroll-behavior:auto} }
</style>
</head>

      <button data-set="ar" aria-label="العربية">عربي</button>
      <button data-set="zh" aria-label="中文">中文</button>
    </div>
  </nav>
</header>

<div class="wrap">
  <aside>
    <div class="mena" id="menaCard">
      <div class="avatar"><img src="img/mena.jpg" loading="lazy" decoding="async" alt="Mena, l'assistante qui présente le dossier"></div>
      <div class="mena-txt">
        <b>Mena</b>
        <span id="menaStatus"></span>
        <div class="player">
          <button class="icon-btn" id="bPrev" data-ta="prevCh" aria-label="Chapitre précédent"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
          <button class="icon-btn main" id="bPlay" aria-label="Écouter Mena"><svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="icon-btn" id="bNext" data-ta="nextCh" aria-label="Chapitre suivant"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <button class="speed" id="bSpeed" data-ta="speed" aria-label="Vitesse de lecture">1×</button>
        </div>
      </div>
    </div>

    <nav class="toc" id="toc" data-ta="chapters" aria-label="Chapitres"></nav>
    <select class="toc-select" id="tocSel" data-ta="pick" aria-label="Choisir un chapitre"></select>

    <section class="chat" data-ta="askH" aria-label="Questions à Mena">
      <div class="chat-h"><span data-t="askH">Posez votre question à Mena</span>
        <label><input type="checkbox" id="voiceAns"> <span data-t="voice">voix</span></label></div>
      <div class="msgs" id="msgs">
        <div class="msg ai" data-t="hello"></div>
      </div>
      <div class="sugg" id="sugg"></div>
      <form id="chatForm">
        <input id="q" autocomplete="off" placeholder="Votre question…" maxlength="600" data-ta="q" aria-label="Votre question">
        <button class="icon-btn main" data-ta="send" aria-label="Envoyer"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
      </form>
    </section>
  </aside>

  <main>
    <div class="hero">
      <div class="kicker" data-t="kicker"></div>
      <h1 data-t="h1"></h1>
      <p data-t="intro"></p>
      <div class="alert" data-th="alert"></div>
    </div>
    <article id="chapter" aria-live="polite"></article>

    <h3 class="sec" id="bordereau" data-t="bord">Bordereau des pièces</h3>
    <div class="tbl"><table class="bord"><thead><tr><th>N°</th><th>Pièce</th><th>Date</th><th>Langue</th><th>Télécharger</th></tr></thead><tbody id="bordBody"></tbody></table></div>
  </main>
</div>

<footer data-t="footer"></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" data-ta="viewer" aria-label="Visionneuse de pièce">
  <div class="lb-h"><span id="lbTitle"></span><button class="btn" id="lbClose" data-t="close">Fermer ✕</button></div>
  <div class="lb-b" id="lbBody"></div>
</div>

    7:["塔里克·曼苏里为什么入狱？"],
    8:["管理人事件有哪些阶段？","20 万欧元冲回是怎么回事？"],
    9:["公证人为什么被免职？","继承公证书草案写了什么？"],
    10:["程序进展如何？"],
    11:["应向法官申请哪些措施？"],
    12:["这些操作怎么会没人察觉？","民事当事人对资金往来有什么要求？"]
   }
  };
  function renderSugg(){ $("#sugg").innerHTML = (SUGG[lang][CH[cur].id]||[]).map(s=>`<button type="button">${esc(s)}</button>`).join("");
    $("#sugg").querySelectorAll("button").forEach(b => b.onclick = () => ask(b.textContent)); }
  function addMsg(txt, who){ const d = document.createElement("div"); d.className = "msg " + who; d.textContent = txt; $("#msgs").appendChild(d); $("#msgs").scrollTop = 1e9; return d; }
  function speakAnswer(t){
    if (!$("#voiceAns").checked || !("speechSynthesis" in window)) return;
    stop(); speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = {fr:"fr-FR",en:"en-GB",ar:"ar",zh:"zh-CN"}[lang]; u.rate = rate;
    const code = new RegExp("^" + lang, "i");
    const v = speechSynthesis.getVoices().find(v => code.test(v.lang) && /female|femme|denise|vivienne|amelie|audrey|julie/i.test(v.name)) || speechSynthesis.getVoices().find(v => code.test(v.lang));
    if (v) u.voice = v;
    u.onstart = () => $("#menaCard").classList.add("speaking");
    u.onend = () => $("#menaCard").classList.remove("speaking");
    speechSynthesis.speak(u);
  }
  async function ask(q){
    q = (q||"").trim(); if (!q) return;
    addMsg(q, "me"); $("#q").value = "";
    const w = addMsg(t("wait"), "ai wait");
    try {
      const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ question:q, history:history.slice(-6), persona:"mena", chapitre:CH[cur].titre, lang }) });
      const d = await r.json().catch(()=>({}));
      const a = (d.error ? t("noAns") : d.answer) || t("noAns");
      w.className = "msg ai"; w.textContent = a;
      if (d.answer){ history.push({role:"user",content:q},{role:"assistant",content:a}); speakAnswer(a); }
    } catch(e){ w.className = "msg ai"; w.textContent = t("noNet"); }
  }
  $("#chatForm").onsubmit = e => { e.preventDefault(); ask($("#q").value); };

  // ---------- démarrage ----------
  try { const s = +localStorage.getItem("mena_ch"); if (s>=0 && s<CH.length) cur = s; } catch(e) {}
  const hash = location.hash.match(/^#ch(\d+)$/); if (hash) cur = Math.min(CH.length-1, +hash[1]);
  setLang(lang);
  fetch("pieces.json").then(r=>r.json()).then(list => { PIECES = list; list.forEach(p => byId[p.id]=p); chargerLangue(lang, () => { render(); renderBordereau(); }); })
    .catch(() => {});
})();
</script>
